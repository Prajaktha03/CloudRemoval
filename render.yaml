services:
  - type: web
    name: cloud-removal-api
    runtime: python
    region: ohio
    plan: standard
    branch: main
    buildCommand: >-
      pip install --upgrade pip &&
      pip install --index-url https://download.pytorch.org/whl/cpu torch &&
      pip install -r requirements-render.txt
    startCommand: bash scripts/start_render.sh
    healthCheckPath: /healthz
    disk:
      name: cloud-removal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: MODEL_CHECKPOINT
        value: /var/data/generator.pt
      - key: MODEL_CHECKPOINT_URL
        sync: false
      - key: DATASET_ROOT
        value: /var/data/raw
      - key: EXPERIMENTS_DB
        value: /var/data/experiments.sqlite3
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_MAX_AGE_SECONDS
        value: "43200"
      - key: FRONTEND_ORIGINS
        sync: false
